name: CI

# The public copy's test run. It is written by scripts/release-public.sh from
# release/public-ci.yml in the private repo; edit it there, not here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install ruff for the simplicity gate tests
        run: python3 -m pip install --quiet ruff
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Smoke test, CLI help
        run: node dist/cli.js help
